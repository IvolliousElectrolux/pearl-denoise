[package]
name = "pearl-denoise"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Desktop UI for the Schnabel historical-recording U-Net denoiser, without added reverb."

[dependencies]
gpui-kit = "0.9"
hound = "3.5"
ndarray = "0.17"
ort = "=2.0.0-rc.15"
rubato = "=0.16.2"
rustfft = "6"
serde_json = "1"
symphonia = { version = "0.5", features = ["aiff", "flac", "mp3", "wav"] }
